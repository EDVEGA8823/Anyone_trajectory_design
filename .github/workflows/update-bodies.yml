name: 小天体データの更新

# GitHub Pages は静的配信なので、実行時に Minor Planet Center を叩けない。
# ここで定期的に配布ファイルを取り、data/bodies/*.json を作り直して置いておく。
#
# 重さの違う2つを回す。新しく見つかった天体と軌道の更新はほぼ毎日入ってくるので
# 毎日、名前付き小惑星と元期 (Epoch) は半年ごとにしか動かないので月1回。
#
#   毎日    --full なし  6.2 MB を取る (NEA 5.0 + 遠方 1.0 + 彗星 0.2)
#   毎月1日 --full あり  181 MB を取り、155万件を走査する (3〜4分)
#
# 毎日の回で 181 MB を落とすと MPC に迷惑なので分けてある。この分け方だと
# MPC から取る量は年 4.5 GB ほどで、毎週 --full (年 9.4 GB) より軽く、
# それでいて7倍新しい。すぐ入れたいときは Actions の画面から手で走らせる。
#
# 記録の膨らみは問題にならない。中身が前回と同じなら build_bodies.py が
# ファイルを書き直さないので、動きが無かった日は commit も起きない。動いた分も
# git が差分で持つので、実測では19日ぶんの変化 (4万件のうち2.1%) を1回の
# commit にして 82 KB だった。
#
# 軽い回でも「よく使う天体」は欠けない。名前付き小惑星は落とさない代わりに、
# 据え置いた named.json から拾い直している (build_bodies.py の
# read_named_rows)。--full の回と同じ結果になることは確かめてある。

on:
  schedule:
    - cron: "0 3 * * *" # 毎日 03:00 UTC (軽い回)
    - cron: "0 15 1 * *" # 毎月1日 15:00 UTC (名前付き小惑星まで作り直す)
  workflow_dispatch:
    inputs:
      full:
        description: "名前付き小惑星も更新する (172MBの配布ファイルを取る)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-bodies
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: データベースを作る
        run: |
          python tools/build_bodies.py \
            ${{ (github.event.schedule == '0 15 1 * *' || inputs.full) && '--full' || '' }} \
            | tee build.log

      - name: 中身を確かめる
        run: python tools/check_bodies.py data/bodies

      - name: 変わっていれば commit する
        run: |
          if [ -z "$(git status --porcelain data/bodies)" ]; then
            echo "変更なし。commitしない" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bodies
          git commit \
            -m "小天体データを更新 ($(date -u +%Y-%m-%d))" \
            -m "出典: IAU Minor Planet Center / tools/build_bodies.py が自動生成"
          git push

      - name: まとめ
        if: always()
        run: |
          echo '## 小天体データ' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 12 build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo '(ログなし)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
