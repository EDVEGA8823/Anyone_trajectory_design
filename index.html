  <script src="https://unpkg.com/three@0.142.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.142.0/examples/js/renderers/CSS2DRenderer.js"></script>

<body>
  <h1>だれでも軌道設計</h1>
  <div id="main_area">
    <div id="graph-panel">
      <canvas id="plot"></canvas>
    </div>
    <div id="UI-panel">
      <div class="sequence-panel-wrapper">
        <div class="sequence-panel-title">ミッションシーケンス</div>
        <div class="sequence-panel">
          <div id="sequence">
            <div class="add_sequence" id="0">+ シーケンスを追加</div>
          </div>
        </div>
      </div>
      <div class="right_panel column">
        <label>操作パネル</label>
        <div class="control-panel bold_box">
          <div class="row box alway">
            <div class="column">
              <label>シーケンス</label>
              <div class="row">
                <div class="red" id="sequence_type"></div>
                <select id="sequence_propaty">
                  打上げ
                </select>
              </div>
            </div>
            <div class="column">
              <label for="propaty">天体</label>
              <select id="propaty"></select>
            </div>
          </div>

          <div class="column box">
            <label for="date_time"><b>時刻</b></label>
            <input type="datetime-local" id="date_time" value="2024-11-20T12:00" />
            <div class="row_right alway">
              <button id="confirm_time">変更</button>
              <button id="cancel_time">キャンセル</button>
            </div>
          </div>

          <div class="column box swingby-only" id="swingby_box">
            <label>スイングバイ (B面)</label>
            <div class="row bplane-row">
              <canvas id="bplane_canvas"></canvas>
              <div class="swingby-controls"></div>
            </div>
          </div>
        </div>
        <div class="row bold_box stat-bar">
          <div class="row stat-group">
            <div class="value_box">
                <div class="title">打上げV<sub>∞</sub></div>
                <div class="value" id="v_inf">0</div>
                <div class="unit">km/s</div>
            </div>
            <span class="paren">(</span>
            <div class="value_box">
                <div class="title">C<sub>3</sub></div>
                <div class="value" id="C3">0</div>
                <div class="unit">km<sup>2</sup>/s<sup>2</sup></div>
            </div>
            <span class="paren">)</span>
          </div>
          <div class="value_box">
            <div class="title">総ΔV</div>
            <div class="value" id="total_dv">0</div>
            <div class="unit">m/s</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
