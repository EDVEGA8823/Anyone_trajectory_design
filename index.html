<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>だれでも軌道設計</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/elements.css" />
  <script src="https://unpkg.com/three@0.142.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.142.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.142.0/examples/js/renderers/CSS2DRenderer.js"></script>
  <script src="./js/lib/math.js"></script>
  <script src="./js/lib/lambert_probrem.js"></script>
  <script type="module" src="./js/main.js"></script>

</head>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-XNQLFPS4RY"></script>

<body>
  <h1>だれでも軌道設計</h1>
  <div id="main_area">
    <div id="graph-panel">
      <canvas id="plot"></canvas>
    </div>
    <div id="UI-panel">
      <div class="sequence-panel-wrapper">
        <div class="sequence-panel-title">ミッションシーケンス</div>
        <div class="row bulk-bar" id="bulk_bar"></div>
        <div class="sequence-panel">
          <div id="sequence">
            <div class="add_sequence" id="0">+ シーケンスを追加</div>
          </div>
        </div>
      </div>
      <div class="right_panel column">
        <label>操作パネル</label>
        <div class="control-panel bold_box">
          <div class="row box alway">
            <div class="column">
              <label>シーケンス</label>
              <div class="row">
                <div class="red" id="sequence_type"></div>
                <select id="sequence_propaty">
                  打上げ
                </select>
              </div>
            </div>
            <div class="column">
              <label for="propaty">天体</label>
              <select id="propaty"></select>
            </div>
          </div>

          <div class="column box">
            <div class="row time-head">
              <label for="date_time"><b>時刻</b></label>
              <span class="edit-target" id="edit_target"></span>
            </div>
            <input type="datetime-local" id="date_time" value="2024-11-20T12:00" />
            <div class="leg-events" id="leg_events"></div>
            <div class="row time-actions alway">
              <div class="row date-nudge" title="時刻を細かくずらす (マウスで大まかに、ここで微調整)">
                <button type="button" data-days="-10">-10</button>
                <button type="button" data-days="-1">-1</button>
                <button type="button" data-days="1">+1</button>
                <button type="button" data-days="10">+10</button>
                <span class="date-nudge-unit">日</span>
              </div>
              <div class="row_right">
                <button id="confirm_time">変更</button>
                <button id="cancel_time">キャンセル</button>
              </div>
            </div>
          </div>

          <div class="column box launch-only" id="launch_box">
            <div class="row swingby-head">
              <label>打上げ (脱出速度)</label>
              <div class="row swingby-mode" id="launch_mode"></div>
            </div>
            <div class="row view-row">
              <div class="view-3d">
                <canvas id="launch_canvas"></canvas>
              </div>
              <div class="launch-controls" id="launch_controls"></div>
            </div>
            <div class="view-legend">
              <span><i class="sw-vinf"></i>脱出速度 V<sub>∞</sub></span>
              <span><i class="sw-alpha"></i>方位角 α</span>
              <span><i class="sw-delta"></i>仰角 δ</span>
              <span><i class="sw-porbit"></i>天体の公転方向 (画面右基準)</span>
              <span>グリッド 1目盛 = 1 km/s</span>
            </div>
          </div>

          <div class="column box end-only" id="end_box">
            <label>最終軌道 (ミッションの成果)</label>
            <div class="end-summary" id="end_summary"></div>
            <div class="row maneuver-readout" id="end_readout"></div>
          </div>

          <div class="column box orbit-only" id="orbit_box">
            <div class="row swingby-head">
              <label id="orbit_title">周回軌道</label>
              <span class="orbit-badge" id="orbit_badge"></span>
            </div>
            <div class="row orbit-row">
              <div class="column swingby-inputs orbit-inputs" id="orbit_inputs"></div>
              <div class="orbit-readout" id="orbit_readout"></div>
            </div>
            <div class="swingby-hint" id="orbit_note"></div>
          </div>

          <div class="column box maneuver-only" id="maneuver_box">
            <label>マヌーバ (DSM)</label>
            <div class="row maneuver-readout" id="maneuver_readout"></div>
          </div>

          <div class="column box swingby-only" id="swingby_box">
            <div class="row swingby-head">
              <label>スイングバイ (B面)</label>
              <div class="row swingby-mode" id="swingby_mode"></div>
            </div>
            <div class="row view-row">
              <div class="view-3d">
                <canvas id="bplane_canvas"></canvas>
              </div>
              <div class="swingby-controls"></div>
            </div>
            <div class="view-legend">
              <span><i class="sw-orbit"></i>双曲線軌道 (ΔV実施)</span>
              <span><i class="sw-coast"></i>ΔV未実施</span>
              <span><i class="sw-rp"></i>近点半径 r<sub>p</sub></span>
              <span><i class="sw-b"></i>B面 / Bベクトル</span>
              <span><i class="sw-beta"></i>回転角 β</span>
              <span><i class="sw-dv"></i>近点ΔV</span>
              <span><i class="sw-porbit"></i>天体の公転方向 (画面右基準)</span>
            </div>
          </div>
        </div>
        <div class="row bold_box stat-bar">
          <div class="row stat-group">
            <div class="value_box" title="地球を離れるときの双曲線余剰速度。&#10;色の目安 (C3): 10未満=楽 / 30未満=普通 / 60未満=苦しい / それ以上=かなり苦しい">
                <div class="title">脱出速度</div>
                <div class="value" id="v_inf">0</div>
                <div class="unit">km/s</div>
            </div>
            <div class="value_box" title="打上げエネルギー (脱出速度の2乗)。&#10;色の目安: 10未満=楽 / 30未満=普通 / 60未満=苦しい / それ以上=かなり苦しい">
                <div class="title">C<sub>3</sub></div>
                <div class="value" id="C3">0</div>
                <div class="unit">km<sup>2</sup>/s<sup>2</sup></div>
            </div>
          </div>
          <div class="value_box" title="ミッション中に探査機が出す速度変化の合計 (DSMと近点ΔV)。&#10;色の目安: 300未満=楽 / 1000未満=普通 / 2500未満=苦しい / それ以上=かなり苦しい">
            <div class="title">総ΔV</div>
            <div class="value" id="total_dv">0</div>
            <div class="unit">m/s</div>
          </div>
          <div class="row stat-group launcher-group">
            <select id="launcher" title="打上げに使うロケット"></select>
            <div class="value_box mass-box">
              <div class="title" title="色の目安 (残る割合): 80%以上=楽 / 50%以上=普通 / 25%以上=苦しい / それ未満=かなり苦しい">質量<span class="sub">燃料込み → 燃料抜き</span></div>
              <div class="value">
                <span id="wet_mass">-</span><span class="mass-arrow" id="mass_arrow"> → </span><span id="dry_mass">-</span>
              </div>
              <div class="unit">kg</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
